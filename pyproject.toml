[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dicom-flow"
version = "0.1.0"
description = "Demo event-driven DICOM pipeline receiver and synthetic data generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydicom>=3.0,<4.0",
    "pynetdicom>=3.0,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<7.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
dicom-flow = "dicom_flow.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dicom_flow"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pydicom.*", "pynetdicom.*", "yaml.*"]
ignore_missing_imports = true
